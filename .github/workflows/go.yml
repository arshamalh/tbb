name: Go

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TELEBOT_SECRET: ${{ secrets.TELEBOT_SECRET }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          USER_ID: ${{ secrets.USER_ID }}
        run: go test -race ./...
